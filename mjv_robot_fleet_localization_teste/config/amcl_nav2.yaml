/**:
  amcl:
    ros__parameters:
      use_map_topic: true
      first_map_only: false

      # Frames são sobrescritos no launch via param_rewrites para receber o
      # prefixo do namespace (ex: robot1/odom). map_frame fica como "map"
      # porque é compartilhado entre todos os robôs.
      global_frame_id: "map"
      odom_frame_id: "odom"
      base_frame_id: "base_link"
      scan_topic: "scan"

      tf_broadcast: true
      transform_tolerance: 0.3

      # Permite recuperar de sequestro / máximos locais
      recovery_alpha_slow: 0.0
      recovery_alpha_fast: 0.0

      min_particles: 1500
      max_particles: 6000
      odom_model_type: "diff"
      alpha1: 0.06
      alpha2: 0.03
      alpha3: 0.05
      alpha4: 0.07
      z_hit: 0.9
      z_short: 0.05
      z_max: 0.05
      z_rand: 0.10
      sigma_hit: 0.2
      lambda_short: 0.05
      update_min_d: 0.05
      update_min_a: 0.05
      resample_interval: 1
      initial_pose:
        x: 0.0
        y: 0.0
        z: 0.0
        yaw: 0.0

# map_server roda FORA dos namespaces dos robôs (compartilhado).
# Mesmo assim deixamos a entrada aqui para conveniência do launch — o launch
# decide se sobe o map_server fora ou dentro do namespace.
map_server:
  ros__parameters:
    yaml_filename: "/home/mjv/maps/Lab_30032026.yaml"
