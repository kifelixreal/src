controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05

    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      max_linear_accel: 0.6
      max_angular_vel: 2.0
      max_angular_accel: 3.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.2
      lookahead_time: 1.5 # Segundos para prever a posição
      regulate_linear_velocity: false
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.10
      rotate_to_heading_angular_vel: 2.5
      rotate_to_heading_min_angle: 0.2
      transform_tolerance: 0.3

      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.5


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      allow_unknown: true
      tolerance: 0.2
      downsample_costmap: false
      max_iterations: 100000
      motion_model_for_search: "MOORE"
      angle_quantization_bins: 16
      smooth_path: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: "map"
      robot_base_frame: "base_link"        # ou o seu frame, se a cadeia TF estiver OK
      rolling_window: false
      resolution: 0.05
      track_unknown_space: true
      # escolha footprint OU robot_radius (se usar footprint, mantenha robot_radius=0.0)
      # robot_radius: 0.22
      footprint: "[[0.20, 0.30], [0.20, -0.30], [-0.20, -0.30], [-0.20, 0.30]]"

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: "odom"
      robot_base_frame: "base_link"
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0

      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        observation_sources: scan
        scan:
          topic: /scan
          obstacle_range: 3.0
          raytrace_range: 3.5
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 3.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link"

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - bt_navigator
      - behavior_server
      - global_costmap
      - local_costmap
